name: Data disco feature
description: Template for adding a feature
title: "✨(FEATURE) "
labels: [ ]
assignees: [ ]
body:
  - type: markdown
    attributes:
      value: |
        ## Data Disco Feature Request

  - type: textarea
    id: user_story
    attributes:
      label: User Story
      value: |
        ---
        AS A  
        I WANT 
        SO THAT
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance Criteria
      description: "acc cre description"
      value: |
        <hr />
        1.
    validations:
      required: true

  - type: textarea
    id: feature_description
    attributes:
      label: Feature Description
      description: "feature description des"
      value: |
        <hr />
        1.
    validations:
      required: true

  - type: textarea
    id: related_tickets
    attributes:
      label: Related Tickets
      description: "related"
      value: |
        <hr />
        1.
    validations:
      required: true

  - type: textarea
    id: standard_tasks
    attributes:
      label: Tasks
      description: "Please specify who needs to be notified after completion of this ticket, or remove this item if not applicable)"
      value: |
        <hr />
        - Notify XXX
        - Clean up any AWS resources created during backlog work
        - DOD Link to checklist: https://utas.atlassian.net/wiki/spaces/IMOS/pages/488898620/Definition+of+Done+DOD
    validations:
      required: true



  - type: markdown
    attributes:
      value: |
        ## PRs
        Pull Request (PR) Review Guidelines: https://utas.atlassian.net/wiki/spaces/IMOS/pages/488996931/Pull+Request+PR+Review+Guidelines

  - type: textarea
    id: prs
    attributes:
      label: PRs
      description: "PR links desc"
      value: |
        <hr />
        1.
    validations:
      required: false

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: "dependencies descr"
      value: |
        <hr />
          1.
    validations:
      required: false

  - type: textarea
    id: demo
    attributes:
      label: Demo
      description: "Demo desc"
      value: |
        <hr />
        1.
    validations:
      required: false